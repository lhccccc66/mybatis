spring.application.name=MyBatis

# ==================== MySQL 数据源配置 ====================
# 1. 用户名:安装 MySQL 时设置的默认用户名
spring.datasource.username=root
# 2. 密码:安装 MySQL 时设置的密码
spring.datasource.password=rootroot
# 3. 连接 URL:主机 + 端口 + 数据库名(库要自己先建)
#    allowMultiQueries=true 允许一次执行多条 SQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_demo_crud?useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
# 4. MySQL 8.x 驱动类是 com.mysql.cj.jdbc.Driver(5.x 才是 com.mysql.jdbc.Driver)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================
# Mapper XML 的位置:classpath:/mapper/ 目录下所有以 Mapper.xml 结尾的文件
mybatis.mapper-locations=classpath:/mapper/*Mapper.xml
# 开启驼峰映射:数据库下划线(tiger_id)自动映射到 Java 驼峰(tigerId)
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== 字符集 ====================
spring.datasource.connection-charset=utf8mb4
spring.datasource.char-encoding=utf8mb4

# ==================== 日志 ====================
# 打印 MyBatis 执行的 SQL 和参数,调试持久层必备
logging.level.com.atguigu.mybatis.mapper=debug
